<!DOCTYPE html>
<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0"/>
	<title>Order Form</title>
	<meta name="description" content="Checkout order form boilerplate" />
	<!-- OPEN GRAPH -->
	
	<!-- CORE CSS  -->
	<link href="core/css/construct.css" type="text/css" rel="stylesheet" media="all"/>
	
	<style>
	header h1, header h2 {padding: 0; margin: 0;}
	</style>
	
</head>
<body class="carbon-black">

<div class="wrap-1600 sudo padded">
	<header class="padded flex middle column rounded fossil smoke-t">
		<h1 class="fluid-text-h2 center">Order Form</h1>
		<h2 class="fluid-text-h4 center">Complete Checkout</h2>
	</header>
	
	<div class="block-wrap">
		<div class="block bw75">
		<form>
			<details open>
				<summary class="lush padded rounded">Order Summary</summary>
				<div class="padded clean">
					<p>list of items</p>
				</div>
			</details>
			
			<details>
				<summary class="lush padded rounded">Payment</summary>
			
			<!-- CREDIT CARD -->
			<div class="brick-wrap">
				<div class="brick b100">
					<h5 class="flow-text">Card Number:</h5>
					<div class="card-input">
						<div class="card-type"></div>
						<input placeholder="0000 0000 0000 0000" onkeyup="$cc.validate(event)" />
						<div class="card-valid">&#10004;</div>
					</div>
				</div>
				<div class="brick b50 card-exp">
					<label>Expiration Date</label><br />
					<input onkeyup="$cc.expiry.call(this,event)" maxlength="7" placeholder="mm/yyyy" />
				</div>
				<div class="brick b50 card-cvv">
					<label>CVV</label><br />
					<input placeholder="XXX"/>
				</div>
			</div>
			<!-- END CARD INPUT -->
			</details>
			
			<details>
				<summary class="lush padded rounded">Shipping</summary>
				<div class="padded clean">
					<fieldset id="copyFrom"><legend>Billing Address</legend>
					<label for="billFName">First Name</label>
					<input id="billFName" name="BillingFirstName" type="text" required="required" />
					<label for="billStreet">Street Address</label>
					<input id="billStreet" name="BillingStreet" type="text" required="required" />
					<label for="billCity">City</label>
					<input id="billCity" name="BillingCity" type="text" required="required" />
					<div class="flex"><div class="half">
						<label for="billState">State</label>
						<select id="billState" name="BillingState" required="required">
							<option value="IN">IN</option>
							<option value="OH">OH</option>
							<option value="MI">MI</option>
						</select>
					</div><div class="half">
						<label for="billZip">Zip</label>
						<input id="billZip" name="BillingZip" type="number" required="required" />
					</div></div>
				</fieldset>
				<fieldset id="pasteTo"><legend>Shipping Address</legend>
					<div class="form-group">
						<input id="field-copy" name="SameAddress" type="checkbox" />
						<label for="field-copy">same as billing</label>
					</div>
					<label for="delivFName">First Name</label>
					<input id="delivFName" name="DeliveryFirstName" type="text" required="required" />
					<label for="delivStreet">Street Address</label>
					<input id="delivStreet" name="DeliveryStreet" type="text" required="required" />
					<label for="delivCity">City</label>
					<input id="delivCity" name="DeliveryCity" type="text" required="required" />
					<div class="flex"><div class="half">
						<label for="shiptoState">State</label>
						<select id="shiptoState" name="ShiptoState" required="required">
							<option value="IN">IN</option>
							<option value="OH">OH</option>
							<option value="MI">MI</option>
						</select>
					</div><div class="half">
						<label for="shipZip">Zip</label>
						<input id="shipZip" name="ShipZip" type="number" required="required" />
					</div></div>
				</fieldset>
				</div>
			</details>
			
		</form>
		</div>
		<div class="block bw25">
		
		</div>
	</div>

</div>

<footer class="padded center bitstream disabled">
	<p><a href="https://www.brutalistframework.com" target="_blank">Brutalist Framework</a> &copy; 2026</p>
</footer>



<!-- Vanilla Javascript -->
<script src="core/jab/fux/credit-card-validator.js" type="text/javascript"></script>
<script src="core/jab/fux/form-functions.js" type="text/javascript"></script>

<!-- jQuery Plugins -->
<script src="core/jab/jquery.3.js"></script>

</body>
</html>
